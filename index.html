<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1411">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budżet">
<link rel="manifest" href="manifest.json">
<title>Mój budżet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
main{overflow-x:clip}
body{font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;background:var(--page,#1c1411)}
button,input{font-family:inherit}
button{cursor:pointer}
.serif{font-family:'Playfair Display',serif}
.view{display:none;position:relative;min-height:100svh;overflow:hidden;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.view.on{display:block}
.mnav{width:36px;height:36px;border-radius:18px;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.18);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mnav:disabled{opacity:.3}
.svhead{min-height:180px;display:flex;flex-direction:column}
.inner{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:max(calc(env(safe-area-inset-top) + 26px), 60px) 16px 0;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.h1{margin:0;font-family:'Playfair Display',serif;font-weight:500;font-size:32px;line-height:1.15}
.h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.row-sb{display:flex;justify-content:space-between;align-items:baseline}
.bar{border-radius:10px;overflow:hidden}
.bar>div{height:100%;border-radius:10px;transition:width .4s ease}
.blur{-webkit-backdrop-filter:blur(16px) saturate(130%);backdrop-filter:blur(16px) saturate(130%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── nav ── */
nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px 4px calc(8px + env(safe-area-inset-bottom));-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);border-top:1px solid transparent}
nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11px;font-weight:500}
nav a span{display:flex;align-items:center;justify-content:center;width:48px;height:28px;border-radius:14px}
nav a[aria-current=page]{font-weight:600}

/* ── month (budget) ── */
#v-budget{background:var(--base);color:#fff}
#v-budget .photo{position:absolute;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 500px);background:var(--photo) center top/cover no-repeat;z-index:0}
#v-budget .fade{position:absolute;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 501px);z-index:0;background:linear-gradient(180deg,var(--scrim) 0px,transparent 170px,transparent 300px,var(--base) 100%)}
#v-budget .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
#v-budget .hero{background:var(--hero);border:1px solid rgba(255,255,255,.22);box-shadow:0 12px 30px rgba(0,0,0,.22)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:66px;padding:9px 10px 10px;border-radius:14px;text-align:left;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);color:#fff}
.tile .n{font-size:13px;font-weight:600;line-height:1.2}
.tile .a{font-size:11px;line-height:1.2;color:var(--muted)}
.tile .t{display:block;width:100%;height:4px;border-radius:4px;margin-top:auto;background:rgba(255,255,255,.12)}
.tile .t i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.tile.over{border-color:var(--over)}
.tile.over .a{color:var(--over);font-weight:600}
.tile.over .t i{background:var(--over)}
.tile.sel{background:var(--acc);border-color:var(--acc);color:var(--accText)}
.tile.sel .a{color:var(--accText)}
.tile.sel .t i{background:var(--accText)}
.tile.pool .t{visibility:hidden}
.amount{display:flex;gap:8px;align-items:stretch}
.amount label{flex:1;display:flex;align-items:center;gap:6px;border:1.5px solid var(--acc);border-radius:18px;padding:0 16px;height:60px;background:rgba(255,255,255,.06)}
.amount input{border:none;outline:none;background:transparent;width:100%;min-width:0;font-family:'Playfair Display',serif;font-size:30px;color:#fff}
.amount input::placeholder{color:rgba(255,255,255,.35)}
.amount .u{font-family:'Playfair Display',serif;font-size:20px;color:var(--muted)}
.amount button{width:120px;height:60px;border:none;border-radius:18px;background:var(--acc);color:var(--accText);font-size:17px;font-weight:600}
.amount button:disabled{opacity:.5}
.desc{display:flex;align-items:center;height:48px;padding:0 16px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06)}
.desc input{border:none;outline:none;background:transparent;width:100%;font-size:15px;color:#fff}
.desc input::placeholder{color:var(--muted)}

/* ── savings ── */
.sv{color:var(--text)}
.sv .glass{background:var(--glass);border:1px solid var(--glassB);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:var(--glassSh)}
.sv .cta{background:var(--cta);border:1px solid var(--ctaB);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);box-shadow:var(--ctaSh);color:#fff}
.sv .muted{color:var(--muted)}
.sv .hl{color:var(--hl)}
#v-Poduszka{background:#5b9bd5 url(img/sky.jpg) center top/100% auto repeat-y}
#v-Korea{background:linear-gradient(180deg,rgba(26,20,56,0) 0px,rgba(26,20,56,0) 77vw,rgba(26,20,56,.85) 133vw,#1a1438 150vw) top left/100% 100% no-repeat,url(img/seoul.jpg) top center/100% auto no-repeat,#1a1438}
#v-Operacja{background:#f3e1d8 url(img/silk.jpg) center top/100% auto repeat-y}
.pearl{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 26%,#fff 0%,#fffaf6 12%,rgba(255,255,255,0) 30%),radial-gradient(circle at 72% 78%,rgba(196,206,255,.35) 0%,rgba(196,206,255,0) 38%),radial-gradient(circle at 38% 34%,#fbf0ea 0%,#f1dcd3 40%,#e2c0b6 68%,#c9a098 90%,#b88e88 100%);box-shadow:inset -12px -16px 28px rgba(150,95,90,.32),inset 10px 12px 22px rgba(255,255,255,.75),0 22px 40px rgba(140,80,75,.26)}
.plan-row{display:grid;grid-template-columns:18px 1fr auto;column-gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--div)}
.plan-row:last-child{border-bottom:none}
.dot{width:10px;height:10px;border-radius:50%;justify-self:center;border:2px solid var(--dot)}
.dot.now{border:none;background:var(--acc)}
.dot.end{border:none;background:var(--acc);box-shadow:0 0 0 3px var(--ring)}
.hrow{position:relative;overflow:hidden;border-bottom:1px solid var(--div)}
.hrow .acts{position:absolute;top:0;right:0;bottom:0;display:flex;visibility:hidden}
.hrow.open .acts{visibility:visible}
.hrow .acts button{width:74px;border:none;font-size:13px;font-weight:600}
.hrow .acts .ed{background:var(--edBg);color:var(--edTx)}
.hrow .acts .rm{background:var(--rm);color:#fff}
.hrow .fg{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:52px;padding:0 4px;transition:transform .2s ease;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.hrow.open .fg{transform:translateX(-148px)}
.start-row{display:flex;align-items:center;gap:12px;height:48px;padding:0 4px}
.q-row{display:grid;grid-template-columns:28px 1fr auto;column-gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--div)}
.q-row:last-child{border-bottom:none}
.q-num{width:28px;height:28px;border-radius:50%;background:rgba(155,79,95,.1);color:#7d3a4a;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.q-row.me .q-num{background:none;border:1.5px solid #9b4f5f;color:#9b4f5f}

/* ── wydatki (checklist) ── */
#v-Wydatki{background:var(--base);color:#fff}
#v-Wydatki .photo{position:absolute;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 260px);background:var(--photo) center 30%/cover no-repeat;z-index:0}
#v-Wydatki .fade{position:absolute;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 261px);z-index:0;background:linear-gradient(180deg,var(--scrim) 0px,transparent 90px,var(--base) 100%)}
#v-Wydatki .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
#v-Wydatki .hero{background:var(--hero);border:1px solid rgba(255,255,255,.22);box-shadow:0 12px 30px rgba(0,0,0,.22)}
.ck{display:grid;grid-template-columns:28px 1fr auto;column-gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:inherit;text-align:left;font:inherit;cursor:pointer}
.ck:last-child{border-bottom:none}
.ck .box{width:28px;height:28px;border-radius:50%;border:2px solid var(--accSoft);display:flex;align-items:center;justify-content:center;color:transparent}
.ck.done .box{border:none;background:var(--acc);color:var(--accText)}
.ck .nm{font-size:15px;font-weight:500}
.ck .am{font-size:15px;font-weight:600;text-align:right}
.ck .du{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.ck .du.late{color:#ffa08f;font-weight:600}
.ck.done .nm{font-weight:400;color:rgba(255,255,255,.55);text-decoration:line-through}
.ck.done .am{font-weight:400;color:rgba(255,255,255,.55)}
.ck.sm{grid-template-columns:24px 1fr auto;column-gap:12px;padding:9px 0}
.ck.sm .box{width:24px;height:24px}
.ck.sm .nm,.ck.sm .am{font-size:14px}
.ck.busy{opacity:.5;pointer-events:none}
.view.in-l{animation:inL .22s ease}
.view.in-r{animation:inR .22s ease}
@keyframes inL{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(-40px);opacity:.4}to{transform:none;opacity:1}}

/* ── sheet ── */
.scrim{position:fixed;inset:0;background:rgba(8,4,28,.5);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:520px;margin:0 auto;border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;transform:translateY(105%);transition:transform .25s ease,visibility .25s;background:var(--sheet);color:var(--sheetTx)}
body.sheet-on .scrim{opacity:1;pointer-events:auto}
body.sheet-on .sheet{transform:none;visibility:visible}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--div)}
.x{width:44px;height:44px;border:none;border-radius:22px;background:var(--tgBg);color:var(--sheetTx);display:flex;align-items:center;justify-content:center}
.tg{display:flex;padding:3px;border-radius:12px;background:var(--tgBg);border:1px solid var(--tgB)}
.tg button{height:32px;min-width:44px;padding:0 12px;border:none;border-radius:9px;font-size:14px;font-weight:600;background:transparent;color:var(--sheetTx)}
.tg button[aria-pressed=true]{background:var(--acc);color:var(--onAcc)}
.sheet .in{flex:1;display:flex;align-items:center;gap:6px;height:56px;padding:0 16px;border:1.5px solid var(--acc);border-radius:16px}
.sheet .in input{border:none;outline:none;background:transparent;width:100%;min-width:0;font-family:'Playfair Display',serif;font-size:26px;color:var(--sheetTx)}
.sheet .save{width:110px;height:56px;border:none;border-radius:16px;background:var(--acc);color:var(--onAcc);font-size:16px;font-weight:600}

/* ── toast & state ── */
.toast{position:fixed;z-index:40;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:16px;background:rgba(20,16,14,.92);color:#fff;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast span{flex:1}
.toast button{border:none;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:14px;height:36px;padding:0 14px;border-radius:10px}
.loading{opacity:.55}
.sync{position:fixed;z-index:21;top:calc(env(safe-area-inset-top) + 8px);right:12px;width:8px;height:8px;border-radius:50%;background:#fff;opacity:0;transition:opacity .2s}
body.busy .sync{opacity:.8;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
</style>
</head>
<body>
<div class="sync" aria-hidden="true"></div>

<main>
  <section class="view" id="v-budget" aria-label="Budżet miesiąca"></section>
  <section class="view" id="v-Wydatki" aria-label="Płatności i przelewy"></section>
  <section class="view sv" id="v-Poduszka" aria-label="Poduszka"></section>
  <section class="view sv" id="v-Korea" aria-label="Korea"></section>
  <section class="view sv" id="v-Operacja" aria-label="Operacja"></section>
</main>

<nav id="nav" aria-label="Menu główne"></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <span class="grab"></span>
  <div style="display:flex;align-items:center;justify-content:space-between">
    <h2 id="sheetTitle" class="serif" style="margin:0;font-weight:500;font-size:22px">Nowa wpłata</h2>
    <button class="x" id="sheetClose" aria-label="Zamknij"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <label for="depAmt" class="h2" style="color:var(--hl)">Kwota</label>
      <div class="tg" role="group" aria-label="Waluta">
        <button id="curZl" aria-pressed="true">zł</button>
        <button id="curEur" aria-pressed="false">€</button>
      </div>
    </div>
    <span style="display:flex;gap:8px">
      <span class="in"><input id="depAmt" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span class="serif" id="depUnit" style="font-size:18px;color:var(--muted)">zł</span></span>
      <button class="save" id="depSave">Wpłać</button>
    </span>
    <span id="rateHint" style="font-size:12px;color:var(--muted)"></span>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTx"></span><button id="toastBtn" hidden>Cofnij</button></div>

<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbxz2WssNOPBOQT8MHUZWUqBVenm7p8Y60DeZGFTflr8PCQO6W_aWU0Rq_xGycEhu9B2/exec';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1MPjPqBR4iXZDJbEX8k5bT7JPGtaQvmJdksxovZpZ_tc/edit';
const CACHE_KEY = 'budzet.data.v2';

// ── Polish month names ──
const MON = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const MON_GEN = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const MON_LOC = ['styczniu','lutym','marcu','kwietniu','maju','czerwcu','lipcu','sierpniu','wrześniu','październiku','listopadzie','grudniu'];
const monIdx = (ym) => Number(String(ym).slice(5, 7)) - 1;
const monName = (ym) => MON[monIdx(ym)];
const monYear = (ym) => MON[monIdx(ym)].toLowerCase() + ' ' + String(ym).slice(0, 4);

// ── 12 monthly themes (variant A) ──
const T = (photo, base, acc, accText, eyebrow, hero, muted, spacer) => ({ photo, base, acc, accText, eyebrow, hero, muted, spacer: spacer || 88 });
const rgba = (h, a) => { h = h.slice(1); return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`; };
const THEMES = [
  T('m01', '#1d3a5a', '#a9d8ff', '#0b2238', '#cfe9ff', rgba('#2f6aa3', .85), '#c4d6e8'),
  T('m02', '#45294b', '#ffa6cc', '#3a0f24', '#ffd3e6', rgba('#a0457a', .85), '#e0c8dc'),
  T('m03', '#1d2f24', '#cfe9a8', '#16240c', '#e2f2cf', rgba('#3d6b45', .86), '#c4d2c6'),
  T('m04', '#3b4a66', '#ffc3d4', '#3d1020', '#ffe1ea', rgba('#b25b7a', .85), '#cfd6e4'),
  T('m05', '#331b3e', '#dcb8ff', '#2a0f38', '#efdcff', rgba('#7a3f96', .86), '#d9c9e2'),
  T('m06', '#1e3823', '#ff8a66', '#2a0a00', '#ffd8c9', rgba('#c2452a', .86), '#c4d4c5'),
  T('m07', '#0b4c55', '#ffb48f', '#3a1408', '#ffe1cf', rgba('#0e6e78', .86), '#c3e6e8'),
  T('m08', '#1c3866', '#ffd23f', '#2a2000', '#fff0b8', rgba('#2f5fa8', .86), '#c7d3e8'),
  T('m09', '#141f16', '#ff7a6b', '#2a0603', '#ffd2cc', rgba('#a8291f', .84), '#bcc9bd'),
  T('m10', '#36220f', '#ffb066', '#2a1404', '#ffe0c2', rgba('#b5652a', .86), '#dccbb9'),
  T('m11', '#1c1411', '#eba066', '#2a1608', '#f3c9a4', rgba('#9a4a22', .86), '#d0c0b4'),
  T('m12', '#0e231c', '#e6c88a', '#1d1a10', '#f2deb0', rgba('#14463a', .88), '#bccbc2', 36)
];

// ── savings screen themes ──
const SV = {
  Poduszka: {
    icon: 'cloud', eyebrow: 'Oszczędności · 6 × 15 000 zł', page: '#5b9bd5', theme: '#5b9bd5', spacer: 0,
    v: { text:'#12305a', muted:'#34557f', acc:'#1f5fae', hl:'#1f5fae', onAcc:'#fff', glass:'rgba(255,255,255,.58)', glassB:'rgba(255,255,255,.75)', glassSh:'0 8px 28px rgba(22,63,120,.14)',
      cta:'rgba(26,78,150,.72)', ctaB:'rgba(255,255,255,.35)', ctaSh:'0 8px 28px rgba(22,63,120,.22)', ctaMuted:'#dbe9fb', ctaBtn:'#fff', ctaBtnTx:'#1f5fae',
      track:'rgba(31,95,174,.16)', div:'rgba(31,95,174,.14)', dot:'#7fa3d3', ring:'rgba(31,95,174,.2)', edBg:'#eef4fc', edTx:'#1f5fae', rm:'#d23b4a',
      sheet:'#fff', sheetTx:'#12305a', tgBg:'#eef4fc', tgB:'#d3e2f5', nav:'rgba(255,255,255,.74)', navB:'rgba(255,255,255,.9)', navIn:'#34557f', navPill:'rgba(31,95,174,.12)',
      headTx:'#fff', headEb:'#fff', headSh:'0 2px 12px rgba(18,48,90,.35)' }
  },
  Korea: {
    icon: 'plane', page: '#1a1438', theme: '#1a1438', spacer: 150,
    v: { text:'#fff', muted:'#d6cff2', acc:'#ff7ab6', hl:'#ff9cc9', onAcc:'#2a0c1f', glass:'rgba(36,26,82,.48)', glassB:'rgba(255,255,255,.18)', glassSh:'0 10px 30px rgba(8,4,28,.35)',
      cta:'rgba(214,64,138,.62)', ctaB:'rgba(255,255,255,.28)', ctaSh:'0 10px 30px rgba(120,20,80,.35)', ctaMuted:'#ffe3ef', ctaBtn:'#fff', ctaBtnTx:'#8a1f5c',
      track:'rgba(255,255,255,.16)', div:'rgba(255,255,255,.12)', dot:'#9a8fd0', ring:'rgba(255,122,182,.25)', edBg:'rgba(255,255,255,.2)', edTx:'#fff', rm:'#d23b4a',
      sheet:'#241b4d', sheetTx:'#fff', tgBg:'rgba(255,255,255,.08)', tgB:'rgba(255,255,255,.16)', nav:'rgba(22,16,48,.76)', navB:'rgba(255,255,255,.12)', navIn:'#c9c2e8', navPill:'rgba(255,122,182,.18)',
      headTx:'#fff', headEb:'#ffd9ea', headSh:'0 2px 14px rgba(10,6,30,.6)' }
  },

// ── API ──
// Zapisy (POST) i odczyty (GET) mogą się mijać. Odczyt, który wystartował przed zapisem
// albo wraca, gdy zapis jeszcze trwa, ma stare dane – wtedy go ignorujemy.
let mutSeq = 0, mutPending = 0;
async function api(body) {
  busy++; document.body.classList.add('busy');
  const seqAtStart = mutSeq;
  const mySeq = body ? ++mutSeq : 0;
  if (body) mutPending++;
  try {
    const res = body
      ? await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      : await fetch(API + '?action=all', { cache: 'no-store' });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Błąd serwera');
    const stale = body ? mySeq !== mutSeq : (mutPending > 0 || mutSeq !== seqAtStart);
    const fresh = body ? json.data : json;
    if (fresh && !stale) { data = fresh; try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {} }
    return json;
  } finally {
    if (body) mutPending--;
    busy--; if (!busy) document.body.classList.remove('busy');
  }
}
async function refresh() {
  try { await api(); render(); }
  catch (e) { if (!data) showError(); else toast('Brak połączenia – pokazuję ostatnie dane'); }
}

async function addExpense() {
  const amount = parseAmt($('expAmt').value);
  if (!(amount > 0)) { $('expAmt').focus(); return; }
  const category = picked;
  const description = $('expDesc') ? $('expDesc').value.trim() : '';
  // optimistic update
  const prev = JSON.parse(JSON.stringify(data));
  const month = getBM();
  bumpBudget(month, category, amount);
  (data.expenses = data.expenses || []).push({ id: 'tmp' + Date.now(), month, category, amount, description });
  $('expAmt').value = ''; if ($('expDesc')) $('expDesc').value = '';
  render();
  try {
    const r = await api({ action: 'addExpense', category, amount, description, month });
    render();
    toast(`Dodano ${n2(amount)} zł · ${category}${month !== data.month ? ' · ' + monName(month).toLowerCase() : ''}`, 'Cofnij', () => undoExpense(r.id, amount, category));
  } catch (e) {
    data = prev; render();
    toast('Nie udało się zapisać. Spróbuj jeszcze raz.');
  }
}

      <div style="display:flex;flex-direction:column;gap:4px">
        <div class="serif" style="font-size:38px;line-height:1">${mixed ? '≈ ' : ''}${fmtG(g.saved)}</div>
        <span class="muted" style="font-size:12px">${savedLine}</span>
      </div>
      <div class="bar" style="height:10px;background:var(--track)"><div style="width:${pct}%;background:var(--acc)"></div></div>
      <div class="row-sb" style="font-size:13px"><span class="muted">${pct}%</span><span class="hl" style="font-weight:600">${done ? 'cel osiągnięty' : (g.expectedEnd ? monYear(g.expectedEnd) : '')}</span></div>
    </section>
    <section class="cta" style="border-radius:${r}px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-size:13px;color:var(--ctaMuted)">Wpłata w tym miesiącu</span>
        <span class="serif" style="font-size:26px">${mMixed ? '≈ ' : ''}${fmtG(mTotal)}</span>
        <span style="font-size:12px;color:var(--ctaMuted)">${planHint}</span>
      </div>
      <button class="open-sheet" style="height:48px;min-width:96px;padding:0 18px;border:none;border-radius:14px;background:var(--ctaBtn);color:var(--ctaBtnTx);font-size:15px;font-weight:600">Wpłać</button>
    </section>
    ${plan.length ? `<section class="glass" style="border-radius:${r}px;padding:12px 18px 4px;display:flex;flex-direction:column">
      <div class="row-sb" style="margin-bottom:4px"><h2 class="h2 hl">Plan do końca celu</h2><span class="muted" style="font-size:12px">stan po miesiącu</span></div>
      ${planRows}</section>` : ''}
    <section class="glass" style="border-radius:${r}px;padding:12px 18px 8px;display:flex;flex-direction:column">
      <div class="row-sb" style="margin-bottom:4px"><h2 class="h2 hl">Historia wpłat</h2><span class="muted" style="font-size:12px">razem ${mixed ? '≈ ' : ''}${fmtG(g.saved)}</span></div>
      ${hist}
      ${g.start > 0 ? `<div class="start-row"><span class="muted" style="flex:1;font-size:14px">Stan na start</span><span style="font-size:16px;font-weight:600">${fmtG(g.start)}</span></div>` : ''}
      ${!deps.length && !g.start ? `<p class="muted" style="margin:0;padding:10px 4px;font-size:14px">Nie ma jeszcze żadnych wpłat.${plan.length && !planNow ? ' Pierwsza w planie w ' + MON_LOC[monIdx(plan[0].month)] + '.' : ''}</p>` : ''}
    </section>
    ${queue}
  </div>`;

  el.querySelector('.open-sheet').onclick = () => openSheet(name, null);
  el.querySelectorAll('.hrow').forEach(bindSwipe);
}

// ── swipe-left on history rows ──
function bindSwipe(row) {
  const id = row.dataset.id, fg = row.querySelector('.fg');
  let x0 = null, y0 = null, dx = 0, horiz = null;
  fg.addEventListener('pointerdown', (e) => { x0 = e.clientX; y0 = e.clientY; dx = 0; horiz = null; });
  fg.addEventListener('pointermove', (e) => {
    if (x0 === null) return;
    const ddx = e.clientX - x0, ddy = e.clientY - y0;
    if (horiz === null && (Math.abs(ddx) > 8 || Math.abs(ddy) > 8)) horiz = Math.abs(ddx) > Math.abs(ddy);
    if (!horiz) return;
    dx = ddx;
    const base = row.classList.contains('open') ? -148 : 0;
    fg.style.transition = 'none';
    fg.style.transform = `translateX(${Math.max(-170, Math.min(0, base + dx))}px)`;
    row.querySelector('.acts').style.visibility = 'visible';
  });
  const end = () => {
    if (x0 === null) return;
    fg.style.transition = ''; fg.style.transform = ''; row.querySelector('.acts').style.visibility = '';
    if (horiz) {
      if (dx < -40) setOpen(id); else if (dx > 30) setOpen(null);
    } else if (openRow && openRow !== id) setOpen(null);
    x0 = null;
  };
  fg.addEventListener('pointerup', end);
  fg.addEventListener('pointercancel', end);
  row.querySelector('.ed').onclick = () => { const d = data.deposits.find((x) => x.id === id); setOpen(null); openSheet(d.goal, d); };
  row.querySelector('.rm').onclick = () => removeDeposit(id);
}
function setOpen(id) {
  openRow = id;
  document.querySelectorAll('.hrow').forEach((r) => r.classList.toggle('open', r.dataset.id === id));
}
document.addEventListener('pointerdown', (e) => { if (openRow && !e.target.closest('.hrow')) setOpen(null); });

async function removeDeposit(id) {
  const d = data.deposits.find((x) => x.id === id);
  if (!d) return;
  const prev = JSON.parse(JSON.stringify(data));
  data.deposits = data.deposits.filter((x) => x.id !== id);
  openRow = null; render();
  try { await api({ action: 'deleteDeposit', id }); render(); toast(`Usunięto wpłatę ${n2(d.amount)} ${d.currency}`); }
  catch (e) { data = prev; render(); toast('Nie udało się usunąć. Spróbuj jeszcze raz.'); }
}

// ── deposit sheet ──
function openSheet(goal, dep) {
  sheetGoal = goal; sheetEdit = dep ? dep.id : null;
  const g = goalOf(goal);
  sheetCur = dep ? dep.currency : g.currency;
  setVars($('sheet'), SV[goal].v);
  $('sheetTitle').textContent = dep ? 'Edytuj wpłatę' : 'Nowa wpłata';
  $('depSave').textContent = dep ? 'Zapisz' : 'Wpłać';
  $('depAmt').value = dep ? String(dep.amount).replace('.', ',') : '';
  $('rateHint').textContent = 'Kurs dziś: 1 € = ' + Number(data.rate).toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' zł';
  setCur(sheetCur);
  document.body.classList.add('sheet-on');
  setTimeout(() => $('depAmt').focus(), 260);
}
function closeSheet() { document.body.classList.remove('sheet-on'); $('depAmt').blur(); }
function setCur(c) {
  sheetCur = c;
  $('curZl').setAttribute('aria-pressed', c === 'zł'); $('curEur').setAttribute('aria-pressed', c === '€');
  $('depUnit').textContent = c;
}
$('curZl').onclick = () => setCur('zł');
$('curEur').onclick = () => setCur('€');
$('sheetClose').onclick = closeSheet;
$('scrim').onclick = closeSheet;
$('depAmt').onkeydown = (e) => { if (e.key === 'Enter') saveDeposit(); };
$('depSave').onclick = saveDeposit;

async function saveDeposit() {
  const amount = parseAmt($('depAmt').value);
  if (!(amount > 0)) { $('depAmt').focus(); return; }
  const goal = sheetGoal, currency = sheetCur, editId = sheetEdit;
  const g = goalOf(goal);
  const prev = JSON.parse(JSON.stringify(data));
  // optimistic
  if (editId) {
    const d = data.deposits.find((x) => x.id === editId);
    if (d) { Object.assign(d, { amount, currency }); }
  } else {
    const today = new Date();
    const iso = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    data.deposits.push({ id: 'tmp' + Date.now(), date: iso, month: data.month, goal, amount, currency });
    const add = toGoalCur(g, amount, currency);
    g.saved += add; g.progress = Math.min(1, g.saved / g.goal);
    if (currency === 'zł') g.savedZl += amount; else g.savedEur += amount;
  }
  closeSheet(); render();
  try {
    await api(editId ? { action: 'editDeposit', id: editId, amount, currency } : { action: 'addDeposit', goal, amount, currency });
    render();
    toast(editId ? 'Zapisano zmianę' : `Wpłacono ${n2(amount)} ${currency} · ${goal}`);
  } catch (e) {
    data = prev; render();
    toast('Nie udało się zapisać. Spróbuj jeszcze raz.');
  }
}

// ── payments / checklist view ──
const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const GOAL_COLORS = { Korea: '#ff7ab6', Poduszka: '#7fb2e5', Operacja: '#e8b4bc' };
let payBusy = {};   // id → true while saving

function paymentsModel() {
  const pm = getPM();
  const isCur = pm === data.month;
  const today = new Date().getDate();
  const pool = (data.expenses || []).filter((e) => e.month === pm);
  const used = new Set();
  const pays = (data.payments || []).slice().sort((a, b) => (a.day || 99) - (b.day || 99));
  // match each payment to one expense: same category and amount, prefer same description
  const rows = pays.map((p) => {
    const cand = pool.filter((e) => !used.has(e.id) && e.category === p.category && Math.abs(e.amount - p.amount) < 0.005);
    const hit = cand.find((e) => e.description === p.name) || cand[0];
    if (hit) used.add(hit.id);
    return { kind: 'pay', key: 'p:' + p.id, name: p.name, amount: p.amount, cur: 'zł', day: p.day, done: !!hit, expenseId: hit ? hit.id : null, pay: p };
  });
  // savings in złoty for this month (IKZE takes everything in zł)
  const depIn = (goal, cur) => data.deposits.filter((d) => d.goal === goal && d.month === pm && (!cur || d.currency === cur));
  Object.keys(data.plan || {}).forEach((goal) => {
    const g = goalOf(goal); if (!g) return;
    const e = (data.plan[goal] || []).find((x) => x.month === pm); if (!e) return;
    const amt = goal === 'IKZE' ? Math.round(e.zl + e.eur * data.rate) : e.zl;
    if (!(amt > 0)) return;
    const paid = goal === 'IKZE' ? depIn(goal).reduce((s, d) => s + toGoalCur(g, d.amount, d.currency), 0) : depIn(goal, 'zł').reduce((s, d) => s + d.amount, 0);
    rows.push({ kind: 'save', key: 's:' + goal, name: goal, amount: amt, cur: 'zł', day: 7, hideDay: true, done: paid >= amt - 0.5 || g.saved >= g.goal - 0.5, goal });
  });
  rows.forEach((r) => {
    r.late = isCur && r.day && !r.hideDay && !r.done && r.day <= today;
    r.dueTxt = r.hideDay || !r.day ? '' : (r.late ? (r.day === today ? 'dziś' : 'po terminie') : 'do ' + r.day + '.');
  });
  const todo = rows.filter((r) => !r.done).sort((a, b) => (a.day || 99) - (b.day || 99));
  const done = rows.filter((r) => r.done);
  // euro account
  const eurGoals = data.goals.filter((g) => g.name !== 'IKZE');
  const balance = eurGoals.map((g) => ({ name: g.name, amt: data.deposits.filter((d) => d.goal === g.name && d.currency === '€').reduce((s, d) => s + d.amount, 0) + (g.currency === '€' ? g.start : 0) }));
  const eurRows = eurGoals.map((g) => {
    const e = (data.plan[g.name] || []).find((x) => x.month === pm);
    if (!e || !(e.eur > 0)) return null;
    const paid = depIn(g.name, '€').reduce((s, d) => s + d.amount, 0);
    return { kind: 'save', key: 'e:' + g.name, name: g.name, amount: e.eur, cur: '€', done: paid >= e.eur - 0.5 || g.saved >= g.goal - 0.5, goal: g.name };
  }).filter(Boolean);
  return { pm, isCur, todo, done, balance, eurRows };
}

function ckRow(r, small) {
  return `<button class="ck ${small ? 'sm' : ''} ${r.done ? 'done' : ''} ${payBusy[r.key] ? 'busy' : ''}" data-key="${esc(r.key)}" aria-pressed="${r.done}" aria-label="${esc((r.done ? 'Odznacz: ' : 'Oznacz jako zrobione: ') + r.name)}">
    <span class="box">${CHECK}</span><span class="nm">${esc(r.name)}</span>
    <span class="am">${n0(r.amount) + ' ' + r.cur}${!small && !r.done && r.dueTxt ? `<span class="du ${r.late ? 'late' : ''}">${r.dueTxt}</span>` : ''}</span></button>`;
}

function renderPayments() {
  const el = $('v-Wydatki');
  const m = paymentsModel();
  const t = THEMES[monIdx(m.pm)];
  setVars(el, { base: t.base, acc: t.acc, accText: t.accText, accSoft: rgba(t.acc, .7), muted: t.muted, hero: t.hero, scrim: rgba(t.base, .45), photo: `url(img/${t.photo}.jpg)` });
  const all = m.todo.length + m.done.length + m.eurRows.length;
  const doneN = m.done.length + m.eurRows.filter((r) => r.done).length;
  const leftZl = m.todo.reduce((s, r) => s + r.amount, 0);
  const leftEur = m.eurRows.filter((r) => !r.done).reduce((s, r) => s + r.amount, 0);
  const pct = all ? Math.round(doneN / all * 100) : 0;
  const eurSum = m.balance.reduce((s, b) => s + b.amt, 0);
  const transfer = m.eurRows.reduce((s, r) => s + r.amount, 0);
  const allRows = m.todo.concat(m.done, m.eurRows);

  el.innerHTML = `
    <div class="photo" aria-hidden="true"></div><div class="fade" aria-hidden="true"></div>
    <div class="inner">
      ${monthTitle(m.pm, 'Płatności i przelewy', t.eyebrow, '0 2px 12px ' + rgba(t.base, .7), 'p')}
      <div style="height:40px"></div>
      <section class="hero blur" style="border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;gap:10px">
        <div class="row-sb" style="font-size:13px;color:rgba(255,255,255,.82)"><span>Zostało do zrobienia</span><span>${doneN} z ${all} gotowe</span></div>
        <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
          <span class="serif" style="font-size:36px;line-height:1">${n0(leftZl)} zł</span>
          ${leftEur > 0 ? `<span class="serif" style="font-size:22px;line-height:1;color:rgba(255,255,255,.82)">+ ${n0(leftEur)} €</span>` : ''}
        </div>
        <div class="bar" style="height:8px;background:rgba(255,255,255,.24)"><div style="width:${pct}%;background:${t.acc}"></div></div>
      </section>
      ${m.todo.length ? `<section class="card blur" style="border-radius:24px;padding:4px 16px">${m.todo.map((r) => ckRow(r)).join('')}</section>` : ''}
      ${`<section class="card blur" style="border-radius:24px;padding:14px 16px 6px;display:flex;flex-direction:column;gap:10px">
        <h2 class="h2" style="color:${t.acc}">Konto w euro</h2>
        <div class="row-sb"><span class="serif" style="font-size:30px;line-height:1">${n0(eurSum)} €</span><span style="font-size:12px;color:var(--muted)">≈ ${n0(eurSum * data.rate)} zł</span></div>
        ${eurSum > 0 ? `<div style="display:flex;height:10px;border-radius:10px;overflow:hidden;gap:2px;background:rgba(255,255,255,.08)">${m.balance.filter((b) => b.amt > 0).map((b) => `<span style="flex:${b.amt} 0 0;background:${GOAL_COLORS[b.name] || t.acc}"></span>`).join('')}</div>` : ''}
        <div>${m.balance.map((b) => `<div style="display:grid;grid-template-columns:10px 1fr auto;column-gap:10px;align-items:center;padding:7px 0">
          <span style="width:10px;height:10px;border-radius:50%;background:${GOAL_COLORS[b.name] || t.acc}"></span><span style="font-size:14px;font-weight:500">${esc(b.name)}</span><span style="font-size:14px;font-weight:600">${n0(b.amt)} €</span></div>`).join('')}</div>
        ${m.eurRows.length ? `<div class="row-sb" style="border-top:1px solid rgba(255,255,255,.1);padding-top:10px">
            <span class="h2" style="color:var(--muted)">Przelew w tym miesiącu</span><span style="font-size:12px;color:var(--muted)">${n0(transfer)} € z firmowego</span></div>
          <div style="margin-top:-4px">${m.eurRows.map((r) => ckRow(r, true)).join('')}</div>` : `<div style="border-top:1px solid rgba(255,255,255,.1);padding:10px 0 8px;font-size:13px;color:var(--muted)">W tym miesiącu bez przelewu w euro</div>`}
      </section>`}
      ${m.done.length ? `<div class="row-sb" style="padding:4px 6px 0"><h2 class="h2" style="color:${t.acc}">Zrobione</h2><span style="font-size:12px;color:var(--muted)">${m.done.length}</span></div>
      <section class="card" style="border-radius:24px;padding:4px 16px;background:rgba(255,255,255,.03)">${m.done.map((r) => ckRow(r)).join('')}</section>` : ''}
      ${!allRows.length ? `<p style="color:var(--muted);text-align:center">Brak płatności – dodaj je w arkuszu, w zakładce „Płatności”.</p>` : ''}
    </div>`;

  el.querySelectorAll('.ck').forEach((b) => b.onclick = () => togglePay(allRows.find((r) => r.key === b.dataset.key), m));
  bindMonthNav(el);
}

async function togglePay(r, m) {
  if (!r || payBusy[r.key]) return;
  if (r.kind === 'save') {
    if (r.done) { toast(`Wpłaty na ${r.goal} zmienisz w karcie ${r.goal}`); return; }
    if (!m.isCur) { toast(m.pm > data.month ? 'Wpłaty na przyszły miesiąc zapiszesz od 1.' : `Wpłaty za ${monName(m.pm).toLowerCase()} zmienisz w karcie ${r.goal}`); return; }
    payBusy[r.key] = true; render();
    try { await api({ action: 'addDeposit', goal: r.goal, amount: r.amount, currency: r.cur }); toast(`Wpłacono ${r.cur === '€' ? n2(r.amount) : n0(r.amount)} ${r.cur} · ${r.goal}`); }
    catch (e) { toast('Nie udało się zapisać. Spróbuj jeszcze raz.'); }
    delete payBusy[r.key]; render(); return;
  }
  payBusy[r.key] = true;
  const prev = JSON.parse(JSON.stringify(data));
  if (r.done) {
    data.expenses = data.expenses.filter((e) => e.id !== r.expenseId);
    bumpBudget(m.pm, r.pay.category, -r.amount);
  } else {
    data.expenses.push({ id: 'tmp' + Date.now(), month: m.pm, category: r.pay.category, amount: r.amount, description: r.name });
    bumpBudget(m.pm, r.pay.category, r.amount);
  }
  render();
  try {
    if (r.done) await api({ action: 'deleteExpense', id: r.expenseId });
    else await api({ action: 'addExpense', category: r.pay.category, amount: r.amount, description: r.name, month: m.pm });
  } catch (e) {
    data = prev; toast('Nie udało się zapisać. Spróbuj jeszcze raz.');
  }
  delete payBusy[r.key]; render();
}

// ── render ──
function showError() {
  $('v-budget').classList.add('on');
  $('v-budget').innerHTML = `<div class="inner" style="padding-top:30vh;text-align:center;color:#fff">
    <p class="serif" style="font-size:24px;margin:0 0 8px">Nie mogę pobrać danych</p>
    <p style="margin:0 0 20px;opacity:.8">Sprawdź internet i spróbuj jeszcze raz.</p>
    <button onclick="refresh()" style="height:48px;padding:0 22px;border:none;border-radius:14px;background:#eba066;color:#2a1608;font-weight:600;font-size:15px">Odśwież</button></div>`;
}
function render() {
  if (!data) return;
  if (!TABS.includes(tab)) tab = 'budget';
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === 'v-' + tab));
  const t = THEMES[monIdx(data.month)];
  const page = tab === 'budget' ? THEMES[monIdx(getBM())].base : tab === 'Wydatki' ? THEMES[monIdx(getPM())].base : SV[tab].page;
  document.body.style.setProperty('--page', page);
  document.querySelector('meta[name=theme-color]').setAttribute('content', page);
  if (tab === 'budget') renderBudget(); else if (tab === 'Wydatki') renderPayments(); else renderSaving(tab);
  renderNav();
}

window.addEventListener('hashchange', () => {
  const prev = TABS.indexOf(tab);
  tab = (location.hash || '#budget').slice(1);
  openRow = null; closeSheet();
  render(); window.scrollTo(0, 0);
  const el = $('v-' + tab), next = TABS.indexOf(tab);
  if (el && prev !== -1 && next !== -1 && prev !== next) {
    el.classList.remove('in-l', 'in-r'); void el.offsetWidth;
    el.classList.add(next > prev ? 'in-l' : 'in-r');
  }
});

// ── swipe between tabs (whole screen) ──
(function () {
  let x0 = null, y0 = null, t0 = 0, skip = false;
  document.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    skip = e.touches.length > 1 || document.body.classList.contains('sheet-on') || !!e.target.closest('.hrow, input, nav');
    x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (x0 === null || skip) { x0 = null; return; }
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8 || Date.now() - t0 > 700) return;
    const i = TABS.indexOf(tab), j = dx < 0 ? i + 1 : i - 1;
    if (j >= 0 && j < TABS.length) location.hash = '#' + TABS[j];
  }, { passive: true });
})();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });

if (data) render(); else { document.body.style.setProperty('--page', '#1c1411'); $('v-budget').classList.add('on'); $('v-budget').innerHTML = '<div class="inner" style="padding-top:40vh;text-align:center;color:#d0c0b4">Ładuję…</div>'; renderNav(); }
refresh();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
